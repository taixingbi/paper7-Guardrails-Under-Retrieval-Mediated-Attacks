[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gurma"
version = "0.1.0"
description = "Guardrails Under Retrieval-Mediated Attacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "tqdm>=4.66",
  "datasets>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
gurma = "gurma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
