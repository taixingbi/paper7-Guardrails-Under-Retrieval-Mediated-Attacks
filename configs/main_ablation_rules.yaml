# Ablation: rules-only input. Reuses main freeze; merges G0 from main.
run_id: main_ablation_rules
output_dir: data/runs/main_ablation_rules
reuse_from: data/runs/main
baseline_g0_from: data/runs/main/5_runs/run_records.jsonl
seed_limit: 100
candidate_limit: 400
clean_pass_mode: both
skip_llm: false
input_hybrid: false
input_guardrail_mode: rules
models:
  llm_a: nova-pro
  llm_b: llama
  guardrail: gpt-oss
  judge: gpt-oss
guardrail_prompt_version: v3
guardrails: [G1, G2]
attacks:
  - indirect_injection
  - context_poisoning
  - policy_retrieval
  - authority_conflict
chat:
  temperature: 0
  max_tokens: 512
  judge_max_tokens: 256
  guardrail_max_tokens: 768
llm_concurrency: 2
http_retries: 5
