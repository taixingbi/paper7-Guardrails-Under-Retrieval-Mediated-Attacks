run_id: smoke
output_dir: data/runs/smoke
seed_limit: 2
candidate_limit: 2
clean_pass_mode: both
use_fixture_seeds: true
fixture_seeds_path: data/fixtures/fixture_seeds.jsonl
skip_llm: true
models:
  llm_a: nova-pro
  llm_b: llama
  guardrail: gpt-oss
  judge: gpt-oss
guardrail_prompt_version: v3
guardrails: [G0, G1, G2]
attacks:
  - indirect_injection
  - context_poisoning
  - policy_retrieval
  - authority_conflict
chat:
  temperature: 0
  max_tokens: 512
  judge_max_tokens: 256
  guardrail_max_tokens: 512
llm_concurrency: 4
http_retries: 5
