# Pilot re-eval with stronger guardrail prompts (v2).
# Reuses frozen seeds/attacks from data/runs/pilot — does not regenerate them.
run_id: pilot_v2
output_dir: data/runs/pilot_v2
reuse_from: data/runs/pilot
seed_limit: 20
candidate_limit: 60
clean_pass_mode: both
use_fixture_seeds: false
skip_llm: false
models:
  llm_a: nova-pro
  llm_b: llama
  guardrail: gpt-oss
  judge: gpt-oss
guardrail_prompt_version: v2
guardrails: [G0, G1, G2]
attacks:
  - indirect_injection
  - context_poisoning
  - policy_retrieval
  - authority_conflict
chat:
  temperature: 0
  max_tokens: 512
  judge_max_tokens: 256
  guardrail_max_tokens: 768
llm_concurrency: 2
http_retries: 5
hotpot_dataset: hotpotqa/hotpot_qa
hotpot_split: validation
hotpot_config: distractor
